name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: saidraya19
          outputs: |
            dist/github-snake.svg?color_snake=%2310B981&color_dots=%23ebedf0,%23a7f3d0,%2334d399,%2310b981,%23047857
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2310B981

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
