<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#062e2a"/>
    </linearGradient>
    <style>
      .name { font: 800 72px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .role { font: 500 26px 'Courier New', monospace; fill: #10B981; }
      .tag  { font: 600 20px 'Courier New', monospace; fill: #7dd3c0; }
      .sym  { font: 700 28px 'Courier New', monospace; fill: #10B981; opacity: .35; }
      .fall { animation: fall 7s linear infinite; }
      .f2 { animation-duration: 9s; animation-delay: -2s; }
      .f3 { animation-duration: 6s; animation-delay: -4s; }
      .f4 { animation-duration: 11s; animation-delay: -6s; }
      @keyframes fall { from { transform: translateY(-60px); } to { transform: translateY(460px); } }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .typing { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 3s ease forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .glow { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .15; } 50% { opacity: .4; } }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle class="glow" cx="1050" cy="200" r="180" fill="#10B981"/>

  <!-- symboles dyal code kay-tehbtou -->
  <text class="sym fall"     x="80"   y="0">{ }</text>
  <text class="sym fall f2"  x="250"  y="0">#include</text>
  <text class="sym fall f3"  x="470"  y="0">for(;;)</text>
  <text class="sym fall f4"  x="700"  y="0">git push</text>
  <text class="sym fall f2"  x="900"  y="0">&lt;/&gt;</text>
  <text class="sym fall f3"  x="1100" y="0">int main()</text>

  <g class="float">
    <text class="name" x="90" y="180">Said Raya</text>
    <line class="typing" x1="92" y1="200" x2="640" y2="200" stroke="#10B981" stroke-width="4"/>
    <text class="role" x="92" y="250">Student Developer | Problem Solver</text>
    <text class="tag" x="92" y="300">C · C++ · JavaScript · Python · Tailwind</text>
    <text class="tag" x="92" y="340">Learn → Work → Build my own startup _</text>
    <rect class="blink" x="560" y="322" width="12" height="22" fill="#10B981"/>
  </g>
</svg>
